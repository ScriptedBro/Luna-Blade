<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b110b" />
  <title>Luna Blade: The High Forest | Nimiq Mini App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <!-- Retro Arcade Header -->
    <header id="arcade-header">
      <div class="header-brand">
        <span class="tree-icon">🌲</span>
        <span class="game-title">LUNA BLADE</span>
        <span class="badge-mini-app">NIMIQ EDITION</span>
      </div>
      
      <div class="header-status">
        <!-- Nimiq Wallet Connect Status Button -->
        <button id="btn-nimiq" class="pixel-wallet-btn" title="Nimiq Altar & Wallet">
          <span class="nimiq-bolt">⚡</span>
          <span id="nimiq-btn-text">NIMIQ</span>
          <span id="nimiq-dot" class="nimiq-dot offline"></span>
        </button>
      </div>
    </header>

    <!-- Main Game Canvas Container -->
    <main id="game-wrapper">
      <div id="game-container">
        <div id="crt-overlay" class="crt-overlay"></div>
      </div>
      
      <!-- Virtual Touch Controls for Mobile Viewport -->
      <div id="touch-controls" class="touch-controls">
        <div class="touch-dpad horizontal-only">
          <button id="touch-left" class="touch-btn dpad-btn" data-key="left" aria-label="Left">◀</button>
          <button id="touch-right" class="touch-btn dpad-btn" data-key="right" aria-label="Right">▶</button>
        </div>

        <div class="touch-actions">
          <button id="touch-upslash" class="touch-btn action-btn upslash" data-key="upslash" aria-label="Up-Air">
            <span>UP-AIR</span>
          </button>
          <button id="touch-attack" class="touch-btn action-btn attack" data-key="attack" aria-label="Slash">
            <span>SLASH</span>
          </button>
          <button id="touch-jump" class="touch-btn action-btn jump" data-key="jump" aria-label="Jump">
            <span>JUMP</span>
          </button>
        </div>
      </div>
    </main>

    <!-- Game Info / Settings Modal Overlay -->
    <div id="modal-container" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h3 id="modal-title">GAME INFO</h3>
          <button id="btn-close-modal" class="pixel-close-btn">✖</button>
        </div>
        <div id="modal-body" class="modal-body">
          <!-- Dynamic Content -->
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
